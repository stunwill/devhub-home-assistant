name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devhub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devhub/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify ingress-safe production assets
        run: |
          if grep -E 'src="/assets/|href="/assets/' dist/index.html; then
            echo 'Root-absolute Vite asset path detected; this breaks Home Assistant ingress.'
            exit 1
          fi
          grep -E 'src="\./assets/|href="\./assets/' dist/index.html
      - name: Verify ingress API routing regression coverage
        run: |
          grep -q "'/api/projects/from-url'" src/ingress.test.ts
          grep -q "'/api/projects'" src/ingress.test.ts
          grep -q '/api/hassio_ingress/abc123/api/projects/from-url' src/ingress.test.ts
      - name: Verify mobile responsive safeguards
        run: |
          grep -q '@media(max-width:800px)' src/styles.css
          grep -q '@media(max-width:480px)' src/styles.css
          grep -q 'aside nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))' src/styles.css
          grep -q 'overflow-wrap:anywhere' src/styles.css
          grep -q 'min-height:44px' src/styles.css
          grep -q '.modal{width:100%;height:100%;max-height:none' src/styles.css

  addon-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate release metadata consistency
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          config = Path('devhub/config.yaml').read_text()
          match = re.search(r'^version:\s*"([^"]+)"', config, re.M)
          if not match:
              raise SystemExit('Unable to read version from devhub/config.yaml')
          version = match.group(1)

          package = json.loads(Path('devhub/frontend/package.json').read_text())
          if package.get('version') != version:
              raise SystemExit(f'Frontend version {package.get("version")} != Home Assistant version {version}')

          backend = Path('devhub/backend/app/main.py').read_text()
          backend_match = re.search(r'^APP_VERSION\s*=\s*"([^"]+)"', backend, re.M)
          if not backend_match or backend_match.group(1) != version:
              raise SystemExit('Backend APP_VERSION does not match Home Assistant version')

          root_changelog = Path('CHANGELOG.md').read_text()
          if not re.search(rf'^## \[{re.escape(version)}\](?:\s|$)', root_changelog, re.M):
              raise SystemExit(f'Root CHANGELOG.md does not contain release {version}')

          ha_changelog = Path('devhub/CHANGELOG.md').read_text()
          if not re.search(rf'^## {re.escape(version)}$', ha_changelog, re.M):
              raise SystemExit(f'devhub/CHANGELOG.md does not contain release {version}')

          if not Path('ROADMAP.md').is_file():
              raise SystemExit('ROADMAP.md is required')

          print(f'Release metadata consistent at {version}')
          PY
      - name: Validate Home Assistant app manifest
        run: |
          grep -q '  - app_config:rw' devhub/config.yaml
          ! grep -q 'addon_config' devhub/config.yaml
          ! grep -q 'armv7' devhub/config.yaml
          grep -q '  - aarch64' devhub/config.yaml
          grep -q '  - amd64' devhub/config.yaml
      - name: Build Home Assistant aarch64 add-on image
        uses: docker/build-push-action@v6
        with:
          context: devhub
          file: devhub/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: devhub-ci:aarch64
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.20
      - name: Verify media processing dependency
        run: |
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh devhub-ci:aarch64 -c 'ffmpeg -version >/dev/null && ffprobe -version >/dev/null'
      - name: Smoke test video frame extraction
        run: |
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh devhub-ci:aarch64 -c '
            ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=320x240:d=1 -c:v mpeg4 -y /tmp/test.mp4 &&
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 /tmp/test.mp4 | grep -q duration= &&
            ffmpeg -hide_banner -loglevel error -ss 0.5 -i /tmp/test.mp4 -frames:v 1 -y /tmp/frame.jpg &&
            test -s /tmp/frame.jpg
          '
      - name: Smoke test add-on startup
        run: |
          mkdir -p /tmp/devhub-config
          docker run --rm -d --platform linux/arm64 --name devhub-smoke \
            -p 18099:8099 \
            -e DEVHUB_DATA_DIR=/config \
            -e DEVHUB_DATABASE_URL=sqlite:////config/devhub.db \
            -v /tmp/devhub-config:/config \
            devhub-ci:aarch64
          cleanup() { docker logs devhub-smoke || true; docker rm -f devhub-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('devhub/config.yaml').read_text()
          print(re.search(r'^version:\s*"([^"]+)"', text, re.M).group(1))
          PY
          )
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18099/api/health >/tmp/devhub-health.json; then
              cat /tmp/devhub-health.json
              grep -q '"version":"'"$VERSION"'"' /tmp/devhub-health.json
              exit 0
            fi
            if ! docker ps --format '{{.Names}}' | grep -q '^devhub-smoke$'; then
              echo 'DevHub container exited before becoming healthy'
              exit 1
            fi
            sleep 2
          done
          echo 'DevHub did not become healthy within 90 seconds'
          exit 1
