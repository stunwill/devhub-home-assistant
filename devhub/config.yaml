name: DevHub
version: "0.6.0"
slug: devhub
description: Development portfolio, feedback, roadmap and release management for Home Assistant
url: https://github.com/stunwill/devhub-home-assistant
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:source-branch
init: false
map:
  - app_config:rw
options:
  github_token: ""
  github_owner: ""
  ai_enabled: false
  ai_provider: "openai"
  ai_model: ""
  ai_api_key: ""
  ai_base_url: "https://api.openai.com/v1"
schema:
  github_token: password
  github_owner: str?
  ai_enabled: bool
  ai_provider: str
  ai_model: str?
  ai_api_key: password
  ai_base_url: str?
