name: DevHub
version: "0.2.0"
slug: devhub
description: Development portfolio, feedback, roadmap and release management for Home Assistant
url: https://github.com/stunwill/devhub-home-assistant
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:source-branch
init: false
map:
  - addon_config:rw
options:
  github_token: ""
  github_owner: ""
schema:
  github_token: password
  github_owner: str?
